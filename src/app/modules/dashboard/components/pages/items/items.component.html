<article class="container">
    <section class="container__modal">

        <app-button 
            (click)="openModal()" 
            class="btn btn-main btn-m" 
            text="Crear articulo" 
            *appRole="Roles.ADMIN"
        ></app-button>
        <app-modal [isVisible]="isModalOpen" (close)="closeModal()">
            <app-text [type]="TextType.H3" content="Crear articulo"></app-text>
            <app-divider></app-divider>
            <form class="container-form" [formGroup]="itemForm" (ngSubmit)="createItem()">
                <div class="container-inputs">
                    <app-input-field 
                        label="Nombre articulo"
                        inputType="text"
                        id="name"
                        name="name"
                        placeholder="Nombre articulo"
                        class="input"
                        formControlName="name"
                        [errorMessage]="itemNameErrorMessage"
                    ></app-input-field>
                    <app-textarea-field
                        label="Descripcion articulo"
                        id="description"
                        name="description"
                        placeholder="Descripcion articulo"
                        class="textarea"
                        formControlName="description"
                        [errorMessage]="itemDescriptionErrorMessage"
                    ></app-textarea-field>
                    <app-input-field 
                        label="Precio articulo"
                        inputType="number"
                        id="price"
                        name="price"
                        placeholder="Precio articulo"
                        class="input"
                        formControlName="price"
                        [errorMessage]="itemPriceErrorMessage"
                    ></app-input-field>
                    <app-input-field 
                        label="Cantidad articulo"
                        inputType="number"
                        id="stock"
                        name="stock"
                        placeholder="Cantidad articulo"
                        class="input"
                        formControlName="stock"
                        [errorMessage]="itemStockErrorMessage"
                    ></app-input-field>
                    <app-select-field
                        label="Marca articulo"
                        id="brand"
                        name="brand"
                        class="selector"
                        [options]="brands"
                        valueParam="id"
                        labelParam="name"
                        [multiple]="false"
                        formControlName="brandId"
                        [errorMessage]="itemBrandErrorMessage"
                    ></app-select-field>
                    <app-multi-select-field
                        label="Categorias articulo"
                        id="categories"
                        [items]="categories"
                        maxSelectionsReach="3"
                        formControlName="categories"
                        [errorMessage]="itemCategoriesErrorMessage"
                    ></app-multi-select-field>
                </div>
                <div class="container-btn">
                    <app-button
                        class="btn btn-main btn-s"
                        text="Crear"
                        [disabled]="!itemForm.valid"
                    ></app-button>  
                </div>
            </form>
    
        </app-modal>
    </section>
    <app-divider></app-divider>
    <section class="container__items">
        <div class="container__items-selectors">
            <app-select-field
                [row]="true"
                label="Mostrar: "
                id="itemsPerPage"
                [options]="[5,10,15]"
                (change)="changeSize($event)"
            ></app-select-field>
            <app-select-field
                [row]="true"
                label="Ordenar por : "
                id="orderBy"
                [options]="[{label:'nombre',value: 'name'}, {label:'marca',value: 'brand'}, {label:'categoria',value:'categories'}]"
                labelParam="label"
                valueParam="value"
                (change)="changeSortParam($event)"
            ></app-select-field>
            <div class="constrols__selector">
                <app-text 
                    content="Ordenar de forma: "
                ></app-text>
                <app-button
                    (click)="changeAsc()"
                    class="btn-text btn-s"
                    [icon]="isAsc ? faArrowDownAZ : faArrowUpAZ"
                ></app-button>
            </div>
        </div>
        <div class="container__items-card">
            <app-card
                *ngFor="let item of items.content"
                [title]="item.name"
                [description]="item.description"
                [price]="parsePrice(item.price)"
                [stock]="item.stock"
                [brand]="item.brand.name"
                [categories]="getCategoriesNames(item.categories)"
            ></app-card>
        </div>
        <div class="container__items-selectors">
            <app-button
                class="btn-text btn-s"
                (click)="previousPage()"
                [disabled]="items.pageNumber === 0"
                [icon]="faAnglesLeft"
            ></app-button>
            <div class="controls__selector">
                <app-text
                    [content]="(items.pageNumber + 1).toString()"
                ></app-text>
            </div>
            <app-button
                class="btn-text btn-s"
                (click)="nextPage()"
                [disabled]="items.last"
                [icon]="faAnglesRight"
            ></app-button>
        </div>
    </section>
</article>

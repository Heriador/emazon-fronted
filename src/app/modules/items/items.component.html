<article class="container">
    <section class="container__modal">

        <app-button 
            (click)="openModal()" 
            class="btn btn-main btn-m" 
            text="Crear articulo" 
            *appRole="Roles.ADMIN"
        ></app-button>
        <app-modal [isVisible]="isModalOpen" (close)="closeModal()">
            <app-text [type]="TextType.H3" content="Crear articulo"></app-text>
            <app-divider></app-divider>
            <form class="container-form" [formGroup]="itemForm" (ngSubmit)="createItem()">
                <div class="container-inputs">
                    <app-input-field 
                        label="Nombre articulo"
                        inputType="text"
                        id="name"
                        name="name"
                        placeholder="Nombre articulo"
                        class="input"
                        formControlName="name"
                        [errorMessage]="itemNameErrorMessage"
                    ></app-input-field>
                    <app-textarea-field
                        label="Descripcion articulo"
                        id="description"
                        name="description"
                        placeholder="Descripcion articulo"
                        class="textarea"
                        formControlName="description"
                        [errorMessage]="itemDescriptionErrorMessage"
                    ></app-textarea-field>
                    <app-input-field 
                        label="Precio articulo"
                        inputType="number"
                        id="price"
                        name="price"
                        placeholder="Precio articulo"
                        class="input"
                        formControlName="price"
                        [errorMessage]="itemPriceErrorMessage"
                    ></app-input-field>
                    <app-input-field 
                        label="Cantidad articulo"
                        inputType="number"
                        id="stock"
                        name="stock"
                        placeholder="Cantidad articulo"
                        class="input"
                        formControlName="stock"
                        [errorMessage]="itemStockErrorMessage"
                    ></app-input-field>
                    <app-select-field
                        label="Marca articulo"
                        id="brand"
                        name="brand"
                        class="selector"
                        [options]="brands"
                        valueParam="id"
                        labelParam="name"
                        [multiple]="false"
                        formControlName="brandId"
                        [errorMessage]="itemBrandErrorMessage"
                    ></app-select-field>
                    <app-multi-select-field
                        label="Categorias articulo"
                        id="categories"
                        [items]="categories"
                        maxSelectionsReach="3"
                        formControlName="categories"
                        [errorMessage]="itemCategoriesErrorMessage"
                    ></app-multi-select-field>
                </div>
                <div class="container-btn">
                    <app-button
                        class="btn btn-main btn-s"
                        text="Crear"
                        [disabled]="!itemForm.valid"
                    ></app-button>  
                </div>
            </form>
    
        </app-modal>

        <app-modal
            [isVisible]="isEditModalOpen"
            (close)="closeEditModal()"
        >
            <app-text [type]="TextType.H3" [content]="'Agregar suministro a producto: '+currentItem?.name"></app-text>
            <app-divider></app-divider>
            <form class="container-form" [formGroup]="supplyForm" (ngSubmit)="addSupply()">
                <div class="container-inputs">
                    <app-input-field
                        label="Cantidad"
                        id="quantity"
                        name="quantity"
                        placeholder="Cantidad"
                        class="input"
                        formControlName="quantity"
                        [errorMessage]="supplyQuantityErrorMessage"
                        inputType="number"
                    ></app-input-field>
                    <app-input-field
                        label="Fecha proximo suministro"
                        id="nextSupplyDate"
                        name="nextSupplyDate"
                        placeholder="Fecha proximo suministro"
                        class="input"
                        formControlName="nextSupplyDate"
                        [errorMessage]="supplyNextSupplyDateErrorMessage"
                        inputType="date"
                    ></app-input-field>
                </div>
                <div class="container-btn">
                    <app-button
                        class="btn btn-main btn-s"
                        text="agregar"
                        [disabled]="supplyForm.invalid"
                    ></app-button>  
                </div>
            </form>
        </app-modal>
    </section>
    <app-divider></app-divider>
    <app-table
        [HeadArray]="headArray"
        [BodyArray]="items"
        [totalElements]="totalElements"
        [totalPages]="totalPages"
        [showActions]="true"
        (pageChange)="changePage($event)"
        (sizeChange)="changeSize($event)"
        (isAscChange)="changeAsc($event)"
        (actionOnClick)="openEditModal($event)"
        (sortParamChange)="changeSortParam($event)"
    ></app-table>
</article>

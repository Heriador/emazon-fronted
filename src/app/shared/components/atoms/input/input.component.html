<input 
    [placeholder]="placeholder"
    [type]="type" 
    class="input" 
    [attr.aria-label]="placeholder"
    [id]="id"
    [name]="name"
    [ngClass]="class"
    [class.error]="error"
    [class.input-error]="error"
    [disabled]="disabled"
    [value]="value"
    (focus)="onFocus($event)"
 >
